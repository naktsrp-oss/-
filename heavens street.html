 let nx='';if(!last){const m=S.M[S.r],lv=dg(m),bar=Math.min(10,Math.max(1,Math.round((m-1)*5)));nx=`<div class="${lv>=3?'bl':''}" style="margin-top:4px;color:${lv>=3?'#e04848':'#f0f8d0'}">NEXT 目標 <b>${S.T[S.r].toLocaleString()}</b> ×${m.toFixed(2)}</div><div>${'☠'.repeat(lv?lv+1:0)} ${DL[lv]}</div><div class="dbar">${Array.from({length:10},(_,i)=>`<i style="${i<bar?'background:#e04848':''}"></i>`).join('')}</div>`;if(lv>=3){shake();bad()}}
 app.innerHTML=`<div class="neon c" style="padding:4px 0"><h1>ROUND ${S.r} CLEAR!</h1><div>正解 <b>${S.rok}/${S.n}</b>　獲得 <b>+${g.toLocaleString()}</b></div><div>目標 ${t.toLocaleString()} ✔</div><div>TOTAL <b>${S.sc.toLocaleString()}</b>　最大コンボ ×${S.best}</div>${nx}</div><button class="big gr" id="nx" style="margin-top:auto">${last?'結果発表！':'次のラウンドへ'}</button>`;
 if(g>0){burst(80,'c');coin()}$('#nx').onclick=()=>{if(last)final();else{S.r++;sel()}}}

function endArt(cv,up){drawStore(cv);const x=cv.getContext('2d'),f=(o,a,b,w,h)=>{x.fillStyle=o;x.fillRect(a,b,w,h)};
 if(up){f('#f8d048',0,0,128,3);for(let i=0;i<10;i++){f('#f8d048',6+i*12,6+(i%3)*3,2,2);f('#f0f8d0',9+i*12,10-(i%2)*4,1,1)}f('#e04848',44,2,40,7);x.fillStyle='#f0f8d0';x.font='8px "DotGothic16",monospace';x.fillText('大繁盛！',64,6)}
 else{x.globalAlpha=.6;f('#102828',0,0,128,80);x.globalAlpha=1;f('#906030',56,52,16,3);f('#906030',56,60,16,3);f('#906030',14,50,40,3);f('#906030',74,56,40,3);f('#102828',12,21,104,16);x.fillStyle='#e04848';x.font='11px "DotGothic16",monospace';x.fillText('閉店',64,29);for(let i=0;i<24;i++)f(i%3?'#e04848':'#f8d048',2+i*5,64-(i%5)*2,2,5+(i%5)*2)}}
function final(over,why){clearInterval(tmr);app.style.background='';const fcb=S.ok==15;if(fcb){S.fb2=5000+Math.round(S.sc*.5);S.sc+=S.fb2}
 const sc=S.sc,up=!over,r=over?'D':sc>=10000?'S':sc>=6500?'A':sc>=4300?'B':sc>=2900?'C':'D';
 app.innerHTML=`<canvas id="st" width="128" height="80" style="width:192px;height:120px"></canvas><div class="neon c" style="display:flex;justify-content:space-around;align-items:center"><div><h1 style="font-size:14px">${up?'店は大発展！':'店は潰れた…'}</h1>SCORE ${sc.toLocaleString()}${fcb?'<br><b>★FULL COMBO+'+S.fb2.toLocaleString()+'</b>':''}</div><div><div style="font-size:10px">RANK</div><div class="rk">${r}</div></div></div><div class="box c">${up?'行列ができた！地獄一の中古店だ！':over?(why?'ノルマ未達…店は閉店に':'ライフが尽きた…店は閉店に'):'熱気に届かず店は閉店に…'}</div><button class="big" id="rp" style="margin-top:auto">もう一度</button>`;
 endArt($('#st'),up);if(document.fonts)document.fonts.ready.then(()=>$('#st')&&endArt($('#st'),up));
 $('#rp').onclick=title;if(up){burst(150,'c');coin()}else bad()}
function fit(){const w=innerWidth,h=innerHeight,k0=Math.min((w-48)/320,(h-48)/288),k=k0>=2?Math.floor(k0):Math.max(k0,.5);app.style.setProperty('--t','scale('+k+')');app.style.transform='scale('+k+')';app.style.left=(w-320*k)/2+'px';app.style.top=Math.max(24,(h-288*k)/2)+'px'}
addEventListener('resize',fit);fit();
title();
</script></body></html>
