let g=e.m?(c.t==e.b?2:0):c.t==e.b?2:(c.t==e.o||CAT[c.t]==CAT[e.b]||CAT[c.t]==CAT[e.o]||R)?1:0;
if(R==2&&!e.m)g=Math.max(g,1)
const base=e.m?(g?8:-6):[-1,1,3][g]*e.x,cb=S.combo|0;let mu=g?mm(cb):1,ex='';
if(R==1&&base>0){mu*=1.5;ex='★ レア効果 ×1.5'}
if(id=='dbl'&&base>0)mu*=2;
const pts=fmt(base>0?base*mu:base);S.combo=g?Math.min(10,cb+(id=='flame'?2:1)):0;
S.score=fmt(S.score+pts);S.dp=fmt(S.dp+pts);if(!S.dv)S.dv={};S.dv[e.p]=fmt((S.dv[e.p]||0)+pts);
const v=e.m?{n:0,p:0}:(S.vis[e.p]||(S.vis[e.p]={n:0,p:0}));if(!e.sp&&!e.m){v.n++;v.p+=pts}
const oo=document.getElementById("orc");if(oo)oo.outerHTML=oracle();
let bonus="";if(g==2){draw(id=='sage'?3:1);bonus=`<br>🃏 カードを${id=='sage'?3:1}枚補充した！`}
if(R==2){ex=`🌈 ${c.n}：${c.a}`;let de=0;if(id=='gift')draw(2);else if(id=='gem')de=30;else if(id=='hint')S.fh=1;else if(id=='dice')de=Math.random()<.5?60:-30;else if(id=='trade'){if(S.hand.length){S.hand.splice(Math.floor(Math.random()*S.hand.length),1);ex+='（手札1枚を失った）'}de=50}
if(de){const p2=fmt(de/2.5);S.score=fmt(S.score+p2);S.dp=fmt(S.dp+p2);S.dv[e.p]=fmt((S.dv[e.p]||0)+p2);ex+=` → 善良評価 ${de>0?'+':''}${de}`;const o2=document.getElementById('orc');if(o2)o2.outerHTML=oracle()}}
if(e.rar==1&&g==2){S.hand.push({...rnd(CARDS.filter(x=>x.r==1))});bonus+='<br>★ レアカードを獲得！'}
if(e.rar==2&&g>=1){S.hand.push({...rnd(SRC)});bonus+='<br>🌈 スーパーレアカードを獲得！'}
const q=rnd(G),line=g?q[2]:q[3],d=Math.round(pts*2.5);
const cl=g?`<div class='cmb'>🔥 COMBO ${S.combo}！${mu>1?` 評価ボーナス ×${fmt(mu)}`:''}<br><small>次の正解は ×${cmM()}</small></div>`:(cb>0?`<div class='cmb' style='color:#9ab'>💔 COMBO ${cb} が途切れた…</div>`:'');
const big=g==2?`<div class="good">GOOD!!<br>大正解！</div>`:g==1?`<div class="good" style="font-size:40px">正解！</div>`:`<div class="ng">ハズレ…</div>`;
app.insertAdjacentHTML("beforeend",`<div class="ov" onclick="this.remove();after()"><div style="text-align:center">${big}<div class="win" style="margin:14px">${c.e} ${c.n} <div class="dnum ${d>0?'up':'dn'}">善良評価 ${d>0?'+':''}${d}</div>${ex?`<div class='cmb'>${ex}</div>`:''}${cl}${bonus}<br>${q[0]} ${q[1]}「${line}」</div><small>タップで次へ</small></div></div>`)}
function bHit(i){const b=S.b,c=S.hand.splice(i,1)[0],R=c.r|0,hit=R==2||CAT[c.t]==b.w,d=R==2?5:(hit?2:1)+(R?1:0);b.hp=Math.max(0,b.hp-d);b.log=`${c.e} ${c.n}！ ${R==2?'🌈 圧倒的な一撃！':hit?'弱点を突いた！':'効いているようだ…'} ${d}ダメージ`;b.hp?bScreen():bWin()}
const RN=['心を込めて手紙を渡す','そっと手を差し伸べる','住処を守ると宣言する','仲間のために身を張る','古い和平の例を引く','博士に弁明させる'];
const SG=[['🌈','誓いの言葉','sure','必ず響く(会心)'],['💎','祈りの光','gem','響く＋善良評価+30']];
function gDeal(){const a=[];GP.split(';').forEach(t=>{const[k,l]=t.split(':');l.split(',').forEach(x=>{const j=x.indexOf(' '),n=x.slice(j+1);a.push([x.slice(0,j),n,[0,0,0],k=='危'?'':k,RN.includes(n)?1:0])})});const sg=rnd(SG);return shf([...shf(a.filter(c=>!c[4])).slice(0,6),...shf(a.filter(c=>c[4])).slice(0,3),[sg[0],sg[1],[0,0,0],sg[2]=='guard'?rnd(['力','心','知']):'SR',2,sg[2],sg[3]]])}
function gcard(c,n,i){const R=c[4]|0,k=c[3];return `<button class="card ${R==2?'sr':R?'rare':''}" ${n?`onclick='gsel(${n},${i})'`:'disabled'}><div class='ct ${R==2?'ksr':k?'k'+k:'kg'}'>${R==2?'🌈 SUPER RARE':k?CATI[k]+k:'⚠️危険'}</div><div class='ci'>${c[0]}</div><div class='cn'>${c[1]}</div>${R==2?`<div class='ab'>${c[6]}</div>`:''}${R?`<div class='st'>${R==2?'✦':'★'}</div>`:''}</button>`}
function lScreen(){const y=scrollY,L=S.L;set(`<div class='scene boss'>${sp('leia',100)}</div><div class='win'><div class='who'>女騎士レイア（第${L.r}合／全3合）</div>${L.st[0]}<br><small>彼女の心に響くのは…${CATI[L.st[1]]}<b>${L.st[1]}</b>（${CATN[L.st[1]]}）系</small>${party()}${S.shield?`<small>🕊️ 神の加護×${S.shield}</small>`:''}</div><div class='win' style='font-size:13px'>切り札を1枚選べ！不正解だと仲間の命が危うい…。<br>⚠️危険カードは逆効果。★レアは効果大、🌈SRは特別な能力。</div><div class='hand big'>${S.gc.map((c,i)=>gcard(c,1,i)).join('')}</div>`);scrollTo(0,y)}
function lHit(i){const L=S.L,c=S.gc.splice(i,1)[0],R=c[4]|0,id=c[5];let da=0,k=0,t,ex='';
if(R==2&&id=='sure'){t='crit';da=3;L.hits++}
else if(R==2&&id=='gem'){t='hit';da=14;L.hits++}
else if(R==2&&id=='revive'){t='hit';da=2;L.hits++;if(S.dead.length){const v=S.dead.splice(Math.floor(Math.random()*S.dead.length),1)[0];S.alive.push(v);ex=`✨ ${G[v][1]}が息を吹き返した！`;if(!S.dead.length)document.body.classList.remove('sad')}}
else if(!c[3]){da=-2;k=2;t='bad'}
else if(c[3]==L.st[1]){const cr=Math.random()<.2;da=(cr?3:2)+(R==1?1:0);t=cr?'crit':'hit';L.hits++}
else{da=Math.random()<.5?-1:0;k=Math.random()<.65?1:2;t='miss';if(R==1)k=Math.max(0,k-1)}
if(id=='guard'&&k){k=0;ex+='🛡️ 盾が仲間を守った！'}
const sv=Math.min(k,S.shield|0);if(sv){S.shield-=sv;k-=sv;ex+=`${ex?'<br>':''}🕊️ 神の加護が仲間を${sv}人守った！`}
const vs=[];for(let j=0;j<k&&S.alive.length;j++){const v=rnd(S.alive);S.alive=S.alive.filter(x=>x!=v);S.dead.push(v);vs.push(v)}if(vs.length)document.body.classList.add('sad');S.ans+=da;
set(`<div class='scene boss'>${sp('leia',100)}</div><div class='win'><div class='who'>${c[0]} ${c[1]}${R==2?'（SR）':R?'（★レア）':''}</div><div class='who' style='color:#fff'>女騎士レイア</div>${rnd(LR[t])}<div class='dnum ${da>0?'up':da<0?'dn':''}'>善良評価 ${da>0?'+':''}${Math.round(da*2.5)}</div>${ex?`<div class='pen'>${ex}</div>`:''}${vs.length?`<div class='pen'>💀 ${vs.map(v=>G[v][1]).join('、')}が斬られた…</div>`:''}</div><div class='win'>${party()}</div><button class="btn" onclick="${L.r>=3?'lEnd()':'lNext();lScreen()'}">${L.r>=3?'決着へ':'次の一合へ'}</button>`);vs.forEach(lDeath)}
function lDeath(v,j=0){setTimeout(()=>{const d=document.createElement('div');d.className='ov dth';d.innerHTML=`${sp(KEYS[v],72)}<div class='ln'><b>${G[v][1]}</b>が斬られた…</div>`;app.appendChild(d);setTimeout(()=>d.remove(),650)},j*700)}

function hintFree(){S.fh=0;S.hint=hintLine();evScreen()}
function finalR(){const t=evalv(),d=S.dead.length,R=t>=270?'SS':t>=225?'S':t>=180?'A':t>=135?'B':t>=90?'C':'D';const e=t>=270?['👑','完全和解エンド','シスターは剣を地に突き、微笑んだ。「あなたたちは本当に善良なゴブリンだった。…これからも、教会へいらっしゃい」']:t>=210?['🤝','和解エンド','「今日のところは剣を収めます。けれど、これからも見ていますからね」住処は守られた！']:t>=135?['⏳','保留エンド','「判断は一週間後に。またお告げを授けに来ます」住処は首の皮一枚で繋がった…。']:['🔥','滅亡エンド','「…神は、ゴブリンをお赦しにならなかった」シスターの剣が閃き、住処は滅せられた…。'];
set(`<div class='scene'>${sp('sis',100)}<span style='font-size:48px'>${e[0]}</span></div><div class='win'><div class='who'>${e[1]}</div>${e[2]}${d?`<br><br><small>…けれど、あの席にはもう誰も座らない。失われた仲間の笑い声は、二度と戻らなかった。</small>`:''}</div><div class='win'><b>— 最終リザルト —</b><div class='rkbig ${d?'m':''}'>${R}${d?'-':''}</div><div style='text-align:center'>最終善良評価：${t}／300</div><small>3日間のポイント：${fmt(S.score)}／対決の得点：${S.ans>0?'+':''}${S.ans}</small><div class='pen'>${d?`犠牲：${S.dead.map(i=>G[i][1]).join('、')}（${d}人）`:'🎖️ 仲間は全員生還！'}</div></div><button class='btn' onclick='start()'>もう一度あそぶ</button>`)}
start();
</script></body></html>
